name: Scheduled Publish

# Promotes 1 pending page → published 4× daily at 05:10 / 11:10 / 17:10 / 23:10 Turkey (UTC+3).
# Builds and deploys to Vercel automatically.

on:
  schedule:
    - cron: '10  2 * * *'   # 05:10 Turkey (UTC+3)
    - cron: '10  8 * * *'   # 11:10 Turkey (UTC+3)
    - cron: '10 14 * * *'   # 17:10 Turkey (UTC+3)
    - cron: '10 20 * * *'   # 23:10 Turkey (UTC+3)
  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the updated publish-schedule.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Promote pending pages
        run: node scripts/publish-next.mjs

      - name: Commit updated schedule
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publish-schedule.json
          git diff --staged --quiet || git commit -m "chore: publish scheduled pages [skip ci]"
          git push

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: IndexNow ping
        run: |
          KEY="dae47b15efa6b6e64898c96d698ad54d"
          HOST="www.homematerialcalc.com"
          URLS=$(node -e "const s=require('./publish-schedule.json');const r=s.runs&&s.runs[0];if(!r||!r.pagesPublished||!r.pagesPublished.length)process.exit(0);console.log(JSON.stringify(r.pagesPublished.map(p=>'https://www.homematerialcalc.com'+p.url)));")
          if [ -z "$URLS" ]; then
            echo "No new pages — skipping IndexNow"
            exit 0
          fi
          echo "Pinging IndexNow for: $URLS"
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" \
            && echo "IndexNow OK" || echo "IndexNow failed (non-fatal)"
