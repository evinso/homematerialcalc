name: Scheduled Publish

# Promotes 1 pending page → published every day at 09:00 UTC (12:00 Turkey).
# Builds and deploys to Vercel automatically.

on:
  schedule:
    - cron: '0  1 * * *'   # 04:00 Turkey (UTC+3)
    - cron: '0  7 * * *'   # 10:00 Turkey (UTC+3)
    - cron: '0 13 * * *'   # 16:00 Turkey (UTC+3)
    - cron: '0 19 * * *'   # 22:00 Turkey (UTC+3)
  workflow_dispatch:         # manual trigger from GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the updated publish-schedule.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Promote pending pages
        run: node scripts/publish-next.mjs

      - name: Commit updated schedule
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publish-schedule.json
          git diff --staged --quiet || git commit -m "chore: publish scheduled pages [skip ci]"
          git push

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
